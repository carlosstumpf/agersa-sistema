services:
  - type: web
    name: agersa-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/agersa_dashboard.py --server.port $PORT --server.address 0.0.0.0 --browser.gatherUsageStats false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
